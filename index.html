<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mickster Vault - Bus Simulator Indonesia TZ Mod</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --text-color: #c9d1d9;
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --glass-border: rgba(0, 240, 255, 0.2);
            --btn-disabled: #21262d;
            --warning-color: #ff3344;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin-top: 30px;
        }

        .game-card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        h1 {
            color: #fff;
            font-size: 26px;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .tagline {
            color: #8b949e;
            font-size: 13px;
            font-style: italic;
            margin: 0;
        }

        .game-title {
            color: var(--neon-blue);
            font-size: 22px;
            margin: 20px 0 5px 0;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Picha ya mchezo */
        .game-image {
            width: 100%;
            max-width: 100%;
            border-radius: 10px;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .share-counter {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #fff;
        }

        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            box-sizing: border-box;
            text-decoration: none;
            text-align: center;
        }

        .btn-share {
            background: linear-gradient(45deg, #25D366, #128C7E);
            color: white;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.3);
        }

        .btn-share:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px #25D366;
        }

        .btn-download {
            background-color: var(--btn-disabled);
            color: #8b949e;
            cursor: not-allowed;
            pointer-events: none;
            border: 1px solid #30363d;
        }

        .btn-download.active {
            background: linear-gradient(45deg, var(--neon-green), #1f883d);
            color: #000;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }

        .btn-download.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--neon-green);
        }

        /* Password Box */
        .password-box {
            background: rgba(57, 255, 20, 0.1);
            border: 1px dashed var(--neon-green);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none; /* Inajificha mwanzoni */
        }

        .password-text {
            font-size: 22px;
            font-weight: bold;
            color: var(--neon-green);
            letter-spacing: 2px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="game-card">
            <h1>MICKSTER VAULT</h1>
            <p class="tagline">For Success Gamers</p>
            
            <div style="border-bottom: 1px solid rgba(255,255,255,0.1); margin: 20px 0;"></div>

            <div class="game-title">Bus Simulator Indonesia (Maleo)</div>
            
            <img src="https://files.catbox.moe/p3pz20.jpg" alt="Bus Simulator Indonesia TZ Mod" class="game-image">

            <p style="font-size: 15px; margin: 0 0 15px 0; color: var(--neon-blue);">📥 MOD YA TANZANIA FULL GAME</p>

            <div class="share-counter">
                Vikundi Vilivyobaki: <span id="badoShare" style="color: var(--neon-blue);">5</span> / 5
            </div>

            <button class="btn btn-share" onclick="pigaShareWhatsApp()">SHARE KWENYE WHATSAPP 🚀</button>

            <a href="https://www.mediafire.com/file/2j89n94kgd0rh05/TRAFFIC_BUS_TZ%25F0%259F%2587%25B9%25F0%259F%2587%25BF%25F0%259F%2587%25B9%25F0%259F%2587%25BF_UKIHITAJI_PINI_NICHEK_0698090890.7z/file" 
               id="downloadBtn" target="_blank" class="btn btn-download">DOWNLOAD GAME (MOD) 📥</a>

            <div id="passBox" class="password-box">
                <span style="font-size: 14px; color: #fff;">🔑 FILE PASSWORD:</span>
                <div class="password-text">477607</div>
                <p style="font-size: 11px; margin: 5px 0 0 0; color: #8b949e;">Iingize wakati wa ku-extract faili kwenye ZArchiver.</p>
            </div>
        </div>
    </div>

    <script>
        let shareZilizobaki = 5;
        
        // Taarifa zako halisi
        const linkYaChaneli = "https://whatsapp.com/channel/0029Vb6MUtB6hENv28MTkw35";
        const ujumbeWako = "Oya! Shusha hii Bus Simulator Indonesia (Maleo) yenye MOD YA TANZANIA FULL GAME bure kabisa hapa Mickster Vault. Jiunge pia na chaneli yetu kupata updates zote: " + linkYaChaneli;
        
        const whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(ujumbeWako);

        function pigaShareWhatsApp() {
            // Inamfungulia mtumiaji WhatsApp moja kwa moja
            window.open(whatsappUrl, '_blank');

            // Inapunguza kaunta mara moja bila ulinzi wa sekunde
            if (shareZilizobaki > 1) {
                shareZilizobaki--;
                document.getElementById('badoShare').innerText = shareZilizobaki;
                alert("Imepokelewa vizuri! Share kwenye vikundi vingine vilivyobaki.");
            } else {
                // Ikifika 0, inafungua kila kitu
                shareZilizobaki = 0;
                document.getElementById('badoShare').innerText = shareZilizobaki;
                document.getElementById('badoShare').style.color = "var(--neon-green)";
                
                // Fungua Button ya Download
                const btnDownload = document.getElementById('downloadBtn');
                btnDownload.classList.add('active');
                btnDownload.innerText = "DOWNLOAD NOW (MEDIAFIRE) 📥";
                
                // Onyesha Boksi la Password
                document.getElementById('passBox').style.display = "block";
                
                alert("🎉 Hongera! Umekamilisha masharti yote. Button ya download na Password vipo wazi sasa.");
            }
        }
    </script>
</body>
</html>
